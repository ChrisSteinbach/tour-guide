version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      production:
        dependency-type: production
    ignore:
      # TODO: Remove this ignore rule once typescript-eslint supports TypeScript 7.
      # Check: npm view typescript-eslint peerDependencies
      - dependency-name: typescript
        versions: [">=7.0.0"]

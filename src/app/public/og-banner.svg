    <line x1="300" y1="315" x2="612" y2="315"/>
  </g>
  <!-- Sweep wedge -->
  <path d="M300 315 L300 15 A300 300 0 0 1 560 165 Z" fill="url(#sweep)"/>
  <!-- Detected-article blips -->
  <g fill="#eaf3ff">
    <circle cx="452" cy="196" r="7" fill-opacity="0.95"/>
    <circle cx="486" cy="405" r="5" fill-opacity="0.8"/>
    <circle cx="150" cy="150" r="5" fill-opacity="0.75"/>
    <circle cx="176" cy="470" r="6" fill-opacity="0.85"/>
  </g>


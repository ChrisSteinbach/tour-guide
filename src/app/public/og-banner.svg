    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#06214f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Solid, theme-independent background (no transparency) -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Radar motif centred on the logo -->

  <defs>
    <radialGradient id="bg" cx="23%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="55%" stop-color="#155ec4"/>
      <stop offset="100%" stop-color="#0a2f6b"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bcd8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bcd8ff" stop-opacity="0"/>
